[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarifytrial"
version = "0.1.0"
description = "Inspectable research workflow for clinical-trial prescreening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
clarifytrial = "clarifytrial.cli:main"

[project.optional-dependencies]
codex-subscription = [
    "openai-codex==0.147.0",
]
retrieval = [
    "faiss-cpu==1.15.0",
    "nltk==3.8.1",
    "numpy==1.26.4",
    "rank-bm25==0.2.2",
    "torch==2.13.0",
    "tqdm==4.65.0",
    "transformers==4.39.3",
]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"prompts" = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
