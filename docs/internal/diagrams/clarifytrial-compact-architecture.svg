<text x="70.0" y="106.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">자유 문장이나 뜻이 모호한 조건이 있을 때 여섯 역할 가운데 필요한 역할만 부른다</text>
