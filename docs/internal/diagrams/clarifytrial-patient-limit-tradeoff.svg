<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">환자가 이용할 수 있는 확인 방법을 반영한 결과</title>
<desc id="desc">새 검사와 추가 방문 제안이 사라진 대신 확인 대기 시험이 늘고, 다섯 시험을 모두 정리한 설정은 줄었다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#98A2B3"/></marker>
</defs>
<rect width="1200" height="675" fill="#F7F9FC"/>
<text x="70.0" y="72.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#182533" text-anchor="start">환자가 이용하기 어려운 확인 방법은 질문 후보에서 먼저 뺐다</text>
<text x="70.0" y="112.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">합성 환자 20명 · 같은 질문 정책에서 이용 제한 적용 여부만 변경</text>
<text x="85.0" y="185.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#17324D" text-anchor="start">제안한 확인 방법</text>
<text x="650.0" y="185.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#17324D" text-anchor="start">제한을 지킨 뒤 남은 대기</text>
<rect x="70.0" y="215.0" width="490.0" height="305.0" rx="18.0" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.0"/>
<rect x="630.0" y="215.0" width="500.0" height="330.0" rx="18.0" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.0"/>
<text x="105.0" y="295.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="600" fill="#182533" text-anchor="start">새 검사</text>
<text x="285.0" y="295.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="44" font-weight="700" fill="#98A2B3" text-anchor="middle">21</text>
<line x1="330.0" y1="282.0" x2="390.0" y2="282.0" stroke="#98A2B3" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="465.0" y="295.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="44" font-weight="700" fill="#2F6FED" text-anchor="middle">0</text>
<text x="105.0" y="420.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="600" fill="#182533" text-anchor="start">추가 방문</text>
<text x="285.0" y="420.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="44" font-weight="700" fill="#98A2B3" text-anchor="middle">56</text>
<line x1="330.0" y1="407.0" x2="390.0" y2="407.0" stroke="#98A2B3" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="465.0" y="420.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="44" font-weight="700" fill="#2F6FED" text-anchor="middle">0</text>
<text x="285.0" y="485.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">제한 적용 전</text>
<text x="465.0" y="485.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#64748B" text-anchor="middle">제한 적용 뒤</text>
<text x="665.0" y="275.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#182533" text-anchor="start">설정 하나에 남은 확인 대기 시험</text>
<text x="835.0" y="335.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#98A2B3" text-anchor="middle">0.88개</text>
<line x1="885.0" y1="322.0" x2="935.0" y2="322.0" stroke="#98A2B3" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1010.0" y="335.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#2F6FED" text-anchor="middle">1.24개</text>
<line x1="665.0" y1="375.0" x2="1095.0" y2="375.0" stroke="#D8DEE8" stroke-width="1.0"/>
<text x="665.0" y="425.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#182533" text-anchor="start">시험 다섯 건을 모두 정리한 설정</text>
<text x="835.0" y="490.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#98A2B3" text-anchor="middle">42/80</text>
<line x1="885.0" y1="477.0" x2="935.0" y2="477.0" stroke="#98A2B3" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1010.0" y="490.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#2F6FED" text-anchor="middle">32/80</text>
<text x="70.0" y="595.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#64748B" text-anchor="start"><tspan x="70.0" dy="0">새 검사와 방문을 피한 만큼 확인 대기 시험이 늘어났다.</tspan><tspan x="70.0" dy="25">끝까지 정리된 설정도 80개 가운데 42개에서 32개로 줄었다.</tspan></text>
</svg>
