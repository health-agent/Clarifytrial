<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ClarifyTrial 상호작용형 사전선별 흐름</title>
  <desc id="desc">환자 정보와 후보 시험을 입력해 초기 상태를 만든 뒤, 미정 시험과 확인 기회가 남아 있으면 다음 정보와 허용된 확인 방법을 선택하고 답과 근거를 얻어 연결된 조건만 다시 판단하는 순환 구조다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>

  <rect x="25" y="35" width="210" height="110" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="130" y="85" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">환자·시험</text>
<text x="130" y="121" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">입력</text>
  <path d="M 235 90 L 275 90" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="275" y="35" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="400" y="85" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">후보 검색</text>
<text x="400" y="121" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">조건별 판단</text>
  <path d="M 525 90 L 565 90" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="565" y="35" width="305" height="110" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="717.5" y="85" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">후보 유지 여부</text>
<text x="717.5" y="121" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">근거 충분 여부</text>
  <path d="M 870 90 L 910 90" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="910" y="35" width="265" height="110" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="1042.5" y="103" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">결과 저장</text>

  <path d="M 650 145 L 650 215 L 170 215 L 170 350" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <rect x="25" y="250" width="1150" height="335" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="55" y="295" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="start" letter-spacing="0">추가 확인</text>

  <rect x="55" y="360" width="230" height="130" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="170" y="438" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">정보 선택</text>
  <path d="M 285 425 L 335 425" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

