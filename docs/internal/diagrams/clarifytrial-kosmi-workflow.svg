<text x="450" y="438" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">확인 방법 선택</text>
  <path d="M 565 425 L 615 425" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="615" y="360" width="230" height="130" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="730" y="438" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="26" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">정보 확인</text>
  <path d="M 845 425 L 895 425" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="895" y="360" width="230" height="130" rx="8" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<text x="1010" y="420" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">관련 조건</text>
<text x="1010" y="456" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="25" font-weight="500" fill="#000000" text-anchor="middle" letter-spacing="0">재판단</text>

  <path d="M 1010 360 L 1010 325 L 790 325 L 790 150" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>

</svg>