<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">환자 정보가 빠졌을 때 먼저 확인할 정보 비교</title>
<desc id="desc">ClarifyTrial 환자 정보가 빠졌을 때 먼저 확인할 정보 비교</desc>
<rect width="1200" height="760" fill="#F5F7FB"/>
<text x="70" y="82" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#172033" text-anchor="start">추가 정보를 최대 세 번 확인한 뒤 최종 상태가 맞은 시험</text>
<text x="70" y="124" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">합성 환자 30명 · 시험 판단 150개 · 추가 확인은 최대 3번</text>
<rect x="55" y="165" width="1090" height="500" rx="20" fill="#FFFFFF" stroke="none"/>
<text x="95" y="220" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start"><tspan x="95" dy="0">추가 정보를 확인하지 않고</tspan><tspan x="95" dy="24">처음 환자 자료만 사용</tspan></text>
<rect x="610" y="205" width="420" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="610" y="205" width="79" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="675" y="237" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">18.7%</text>
<text x="95" y="320" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start"><tspan x="95" dy="0">입력 파일에 적힌 순서대로</tspan><tspan x="95" dy="24">최대 3개를 확인</tspan></text>
<rect x="610" y="305" width="420" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="610" y="305" width="395" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="991" y="337" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">94.0%</text>
<text x="95" y="420" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172033" text-anchor="start"><tspan x="95" dy="0">현재 가장 많은 미완료 시험에</tspan><tspan x="95" dy="24">연결된 정보부터 확인</tspan></text>
<rect x="610" y="405" width="420" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="610" y="405" width="400" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="996" y="437" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">95.3%</text>
<text x="95" y="520" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="18" font-weight="600" fill="#172033" text-anchor="start"><tspan x="95" dy="0">남은 3번 안에 사용할 정보 조합을</tspan><tspan x="95" dy="24">매번 다시 계산</tspan></text>
<rect x="610" y="505" width="420" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="610" y="505" width="400" height="48" rx="12" fill="#356AE6" stroke="none"/>
<text x="996" y="537" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">95.3%</text>
<text x="70" y="716" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#356AE6" text-anchor="start">결과</text>
<text x="132" y="716" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">28개 · 141개 · 143개 · 143개. 마지막 두 방법의 최종 결과는 같았다.</text>
</svg>
