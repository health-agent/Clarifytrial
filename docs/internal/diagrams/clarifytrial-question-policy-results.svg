<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">세 번 확인했을 때 끝낸 시험 판단</title>
<desc id="desc">ClarifyTrial 연구 결과를 보여 주는 코드 기반 그림</desc>
<rect width="1200" height="700" fill="#F5F7FB"/>
<text x="70" y="82" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#172033" text-anchor="start">세 번 확인했을 때 끝낸 시험 판단</text>
<text x="70" y="124" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#64748B" text-anchor="start">새 합성 환자 30명 · 시험 판단 150건 · 미리 계산한 최종 상태와 비교</text>
<rect x="55" y="165" width="1090" height="450" rx="20" fill="#FFFFFF" stroke="none"/>
<text x="95" y="251" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#172033" text-anchor="start">질문하지 않음</text>
<rect x="390" y="220" width="650" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="390" y="220" width="273" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="649" y="252" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">42%</text>
<text x="95" y="343" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#172033" text-anchor="start">정해진 순서대로 확인</text>
<rect x="390" y="312" width="650" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="390" y="312" width="488" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="864" y="344" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">75%</text>
<text x="95" y="435" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="400" fill="#172033" text-anchor="start">영향받는 시험 수만 고려</text>
<rect x="390" y="404" width="650" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="390" y="404" width="566" height="48" rx="12" fill="#AAB5C5" stroke="none"/>
<text x="942" y="436" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">87%</text>
<text x="95" y="527" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="23" font-weight="600" fill="#172033" text-anchor="start">남은 확인 횟수까지 고려</text>
<rect x="390" y="496" width="650" height="48" rx="12" fill="#EEF2F7" stroke="none"/>
<rect x="390" y="496" width="578" height="48" rx="12" fill="#356AE6" stroke="none"/>
<text x="954" y="528" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="end">89%</text>
<text x="70" y="659" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="700" fill="#356AE6" text-anchor="start">해석</text>
<text x="132" y="659" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#172033" text-anchor="start">현재 방식은 같은 세 번의 확인에서 고정 순서보다 13%p 더 많은 판단을 끝냈다.</text>
</svg>
