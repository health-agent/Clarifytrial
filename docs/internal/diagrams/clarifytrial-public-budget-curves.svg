<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">환자 정보를 확인하는 순서와 최종 상태 일치</title>
<desc id="desc">공개 조건 합성 환자에서 확인 기회 0회부터 5회까지 세 질문 순서의 최종 시험 상태 일치율을 비교한 선 그래프다.</desc>
