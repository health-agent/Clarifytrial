<text x="70.0" y="112.0" font-family="Pretendard, Noto Sans KR, Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#64748B" text-anchor="start">10개 질환의 합성 환자 50명 · 최종 평가 30명 · 환자마다 공개 시험 5건</text>
