<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc">
  <title id="title">ClarifyTrial v5 실제 멀티에이전트 흐름</title>
  <desc id="desc">고정 에이전트 세 개가 진행 관리, 검색과 판정, 다음 확인을 나누어 맡는다. 중요한 결론에 위험 신호가 있을 때만 네 번째 검토 에이전트가 독립적으로 근거를 확인한다. 검색 색인, 환자 상태표, 날짜와 수치 검사, 정보 획득 환경은 에이전트가 아닌 공통 자료와 도구다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#48677F"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7C3AED"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; fill: #153B5B; }
      .title { font-size: 40px; font-weight: 700; letter-spacing: -0.8px; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #526C80; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
      .heading { font-size: 25px; font-weight: 700; letter-spacing: -0.3px; }
      .body { font-size: 17px; font-weight: 500; fill: #3C586D; }
      .small { font-size: 14px; font-weight: 600; fill: #637B8D; }
      .badge { font-size: 15px; font-weight: 700; }
      .agent-label { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .number { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .edge-label { font-size: 15px; font-weight: 700; fill: #48677F; }
      .line { fill: none; stroke: #48677F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #0F766E; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; marker-end: url(#arrow-teal); }
      .review-loop { fill: none; stroke: #7C3AED; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 7; marker-end: url(#arrow-purple); }
