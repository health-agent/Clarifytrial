<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">ClarifyTrial 임상시험 사전 선별 흐름</title>
  <desc id="desc">임상시험 원문과 환자 상태표를 준비하고 후보 검색, 조건별 판단, 근거 확인을 거쳐 후보 유지와 현재 조건 확인을 따로 판단한다. 정보가 부족하면 기존 기록, 환자 질문, 공식 확인 또는 보류 중 하나를 선택하고 관련 조건만 다시 판단한다.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2942" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#42647F"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif; fill: #153B5B; }
      .title { font-size: 38px; font-weight: 700; letter-spacing: -0.8px; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #526C80; }
      .step { font-size: 15px; font-weight: 700; letter-spacing: 0.6px; }
      .heading { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; }
      .body { font-size: 17px; font-weight: 500; fill: #3C586D; }
      .source { font-size: 14px; font-weight: 700; fill: #637B8D; }
      .status { font-size: 15px; font-weight: 700; }
      .route { font-size: 15px; font-weight: 700; }
      .edge-label { font-size: 15px; font-weight: 700; fill: #42647F; }
      .line { fill: none; stroke: #42647F; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #0F766E; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 9 8; marker-end: url(#arrow-teal); }
    </style>
  </defs>

  <rect x="20" y="20" width="1560" height="1140" rx="34" fill="#F8FAFC" stroke="#DCE7EF" stroke-width="2"/>
  <text x="800" y="76" text-anchor="middle" class="title">ClarifyTrial 임상시험 사전 선별 흐름</text>
  <text x="800" y="110" text-anchor="middle" class="subtitle">가능성을 남기는 판단과 지금 조건 확인을 끝낼 수 있는지 판단을 따로 본다</text>

  <g filter="url(#shadow)">
    <rect x="120" y="150" width="600" height="140" rx="24" fill="#FFFFFF" stroke="#A9C6D8" stroke-width="2"/>
    <rect x="120" y="150" width="12" height="140" rx="6" fill="#2563EB"/>
  </g>
  <text x="165" y="185" class="step" fill="#2563EB">입력 1 · 임상시험</text>
  <text x="165" y="225" class="heading">버전이 확인된 임상시험 원문</text>
  <text x="165" y="260" class="body">선정·제외 조건, 수치, 기간, 논리와 원문 위치를 미리 정리</text>
  <text x="680" y="185" text-anchor="end" class="source">TrialMatchAI · EXACT</text>

  <g filter="url(#shadow)">
    <rect x="880" y="150" width="600" height="140" rx="24" fill="#FFFFFF" stroke="#9DCEC7" stroke-width="2"/>
    <rect x="880" y="150" width="12" height="140" rx="6" fill="#0F766E"/>
  </g>
  <text x="925" y="185" class="step" fill="#0F766E">입력 2 · 환자 정보</text>
  <text x="925" y="225" class="heading">날짜와 출처가 붙은 환자 상태표</text>
  <text x="925" y="260" class="body">현재까지 확보한 기록만 정리하고 모든 단계가 같은 값을 사용</text>
  <text x="1440" y="185" text-anchor="end" class="source">PRomop</text>

  <path d="M420 290 C420 320 350 318 350 340" class="line"/>
  <path d="M1180 290 C1180 322 500 304 350 340" class="line"/>

  <g filter="url(#shadow)">
    <rect x="180" y="350" width="340" height="120" rx="22" fill="#FFFFFF" stroke="#B9CCE0" stroke-width="2"/>
  </g>
  <circle cx="220" cy="390" r="20" fill="#E8F0FF"/>
  <text x="220" y="397" text-anchor="middle" class="step" fill="#2563EB">2</text>
  <text x="350" y="400" text-anchor="middle" class="heading">후보 시험 검색</text>
  <text x="350" y="433" text-anchor="middle" class="body">규칙 필터 + 글자·의미 검색</text>
  <text x="350" y="456" text-anchor="middle" class="source">TrialMatchAI · TrialGPT</text>

  <path d="M520 410 L630 410" class="line"/>

  <g filter="url(#shadow)">
    <rect x="630" y="350" width="340" height="120" rx="22" fill="#FFFFFF" stroke="#B9CCE0" stroke-width="2"/>
  </g>
  <circle cx="670" cy="390" r="20" fill="#EEF2FF"/>
  <text x="670" y="397" text-anchor="middle" class="step" fill="#4F46E5">3</text>
  <text x="800" y="400" text-anchor="middle" class="heading">조건별 판단</text>
  <text x="800" y="433" text-anchor="middle" class="body">선정 조건과 제외 조건을 따로 판단</text>
  <text x="800" y="456" text-anchor="middle" class="source">TrialMatchAI</text>

  <path d="M970 410 L1080 410" class="line"/>

  <g filter="url(#shadow)">
    <rect x="1080" y="350" width="340" height="120" rx="22" fill="#FFFFFF" stroke="#B9CCE0" stroke-width="2"/>
  </g>
  <circle cx="1120" cy="390" r="20" fill="#F3E8FF"/>
  <text x="1120" y="397" text-anchor="middle" class="step" fill="#7C3AED">4</text>
  <text x="1250" y="400" text-anchor="middle" class="heading">근거 확인</text>
  <text x="1250" y="433" text-anchor="middle" class="body">양쪽 원문·날짜·수치 대조</text>
  <text x="1250" y="456" text-anchor="middle" class="source">TRIAGE</text>

  <path d="M1250 470 C1250 515 630 500 440 550" class="line"/>
  <path d="M1250 470 C1250 515 1135 515 1160 550" class="line"/>

  <g filter="url(#shadow)">
    <rect x="160" y="560" width="560" height="170" rx="26" fill="#ECFDF5" stroke="#2CB5A5" stroke-width="3"/>
  </g>
  <text x="200" y="598" class="step" fill="#0F766E">판단 1 · 후보 유지</text>
  <text x="440" y="643" text-anchor="middle" class="heading">이 환자를 계속 검토할 가치가 있는가?</text>
  <rect x="205" y="674" width="128" height="34" rx="17" fill="#CCFBF1"/>
  <text x="269" y="696" text-anchor="middle" class="status" fill="#0F766E">후보 유지</text>
  <rect x="344" y="674" width="128" height="34" rx="17" fill="#F1F5F9"/>
  <text x="408" y="696" text-anchor="middle" class="status" fill="#526C80">판단 어려움</text>
  <rect x="483" y="674" width="128" height="34" rx="17" fill="#FEE2E2"/>
  <text x="547" y="696" text-anchor="middle" class="status" fill="#B42318">후보 제거</text>

  <g filter="url(#shadow)">
    <rect x="880" y="560" width="560" height="170" rx="26" fill="#EFF6FF" stroke="#4D8AE8" stroke-width="3"/>
  </g>
  <text x="920" y="598" class="step" fill="#2563EB">판단 2 · 현재 조건 확인</text>
  <text x="1160" y="643" text-anchor="middle" class="heading">지금 가진 자료로 확인을 끝낼 수 있는가?</text>
  <rect x="920" y="674" width="112" height="34" rx="17" fill="#DBEAFE"/>
  <text x="976" y="696" text-anchor="middle" class="status" fill="#1D4ED8">확인 완료</text>
  <rect x="1044" y="674" width="112" height="34" rx="17" fill="#FEF3C7"/>
  <text x="1100" y="696" text-anchor="middle" class="status" fill="#B45309">확인 대기</text>
  <rect x="1168" y="674" width="112" height="34" rx="17" fill="#FEE2E2"/>
  <text x="1224" y="696" text-anchor="middle" class="status" fill="#B42318">부적합</text>
  <rect x="1292" y="674" width="112" height="34" rx="17" fill="#F1F5F9"/>
  <text x="1348" y="696" text-anchor="middle" class="status" fill="#526C80">판단 어려움</text>

  <path d="M440 730 C440 770 650 770 680 805" class="line"/>
  <path d="M1160 730 C1160 770 950 770 920 805" class="line"/>

  <g filter="url(#shadow)">
    <rect x="560" y="805" width="480" height="110" rx="28" fill="#FFF7E6" stroke="#E3A33B" stroke-width="3"/>
  </g>
  <text x="800" y="840" text-anchor="middle" class="source" fill="#B45309">MediQ식 정보 충분성 판단</text>
  <text x="800" y="878" text-anchor="middle" class="heading">중요한 조건을 지금 결정할 수 있는가?</text>

  <path d="M660 915 C620 940 470 942 410 965" class="line"/>
  <text x="545" y="946" text-anchor="middle" class="edge-label">예</text>
  <path d="M940 915 C980 940 1125 920 1180 945" class="line"/>
  <text x="1050" y="938" text-anchor="middle" class="edge-label">아니오</text>

  <g filter="url(#shadow)">
    <rect x="120" y="970" width="580" height="145" rx="24" fill="#F5F3FF" stroke="#8B75D7" stroke-width="2"/>
  </g>
  <text x="160" y="1008" class="step" fill="#6D4BC3">현재 결과</text>
  <text x="160" y="1047" class="heading">후보·확인 상태·근거·남은 정보 표시</text>
  <text x="160" y="1083" class="body">등록 결정은 해당 임상시험 연구진과 의료진이 확인</text>

  <g filter="url(#shadow)">
    <rect x="880" y="950" width="600" height="180" rx="24" fill="#FFFFFF" stroke="#D9A441" stroke-width="2"/>
  </g>
  <text x="920" y="988" class="step" fill="#B45309">다음 확인 하나 선택 · DQueST · Fink</text>
  <text x="920" y="1027" class="heading">결과를 바꿀 수 있는 부족 정보부터 확인</text>
  <rect x="920" y="1052" width="120" height="38" rx="19" fill="#E0F2FE"/>
  <text x="980" y="1077" text-anchor="middle" class="route" fill="#0369A1">기존 기록</text>
  <rect x="1052" y="1052" width="120" height="38" rx="19" fill="#DCFCE7"/>
  <text x="1112" y="1077" text-anchor="middle" class="route" fill="#15803D">환자 질문</text>
  <rect x="1184" y="1052" width="120" height="38" rx="19" fill="#F3E8FF"/>
  <text x="1244" y="1077" text-anchor="middle" class="route" fill="#7E22CE">공식 확인</text>
  <rect x="1316" y="1052" width="120" height="38" rx="19" fill="#F1F5F9"/>
  <text x="1376" y="1077" text-anchor="middle" class="route" fill="#526C80">보류</text>
  <text x="1180" y="1110" text-anchor="middle" class="source" fill="#0F766E" style="font-size:12.5px">CLEAR-MATCH · Yang · 새 정보에는 출처와 날짜를 붙여 후보와 관련 조건만 다시 판단</text>

  <path d="M880 1068 C790 1040 785 560 800 470" class="loop"/>
</svg>
