name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python312:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic test environment
        shell: pwsh
        run: |
          python -m pip install -c constraints/repro-python312.txt -e ".[dev,retrieval-bm25]"
          python -m nltk.downloader punkt

      - name: Run tests and dependency check
        shell: pwsh
        run: |
          python -m pytest -q
          python -m pip check

      - name: Build and test the wheel outside the checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m venv "$env:RUNNER_TEMP\clarifytrial-wheel"
          $wheel = (Get-ChildItem dist\clarifytrial-*.whl).FullName
          & "$env:RUNNER_TEMP\clarifytrial-wheel\Scripts\python.exe" -m pip install $wheel
          Push-Location $env:RUNNER_TEMP
          try {
            & "$env:RUNNER_TEMP\clarifytrial-wheel\Scripts\python.exe" -c "from clarifytrial.llm.prompts import repository_prompt_loader; assert 'criterion' in repository_prompt_loader()('prompts/matcher_judge.md').lower()"
            & "$env:RUNNER_TEMP\clarifytrial-wheel\Scripts\clarifytrial.exe" --help
          } finally {
            Pop-Location
          }
